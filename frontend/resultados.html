<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Resultados Finalizados - Analitic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --accent: #a5d6a7;
            --text: #1a5c22;
            --text-light: #424242;
            --shadow: 0 10px 30px rgba(46, 125, 50, 0.12);
            --hover-shadow: 0 20px 50px rgba(46, 125, 50, 0.22);
            --border: #d1d5db;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f9f0 0%, #e8f5e9 100%);
            margin: 0;
            color: var(--text);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        h1 {
            text-align: center;
            font-size: 2.4rem;
            margin-bottom: 2.2rem;
            color: var(--primary);
            font-weight: 700;
        }

        .layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 2rem;
        }

        .results-list,
        .detail-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .results-list {
            max-height: 82vh;
            overflow-y: auto;
            position: sticky;
            top: 2rem;
            align-self: start;
        }

        .results-list h3 {
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 1.4rem;
            font-weight: 600;
        }

        .result-item {
            padding: 1.3rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.25s;
            border-left: 4px solid transparent;
        }

        .result-item:hover,
        .result-item.selected {
            background: #e8f5e9;
            transform: translateX(4px);
            border-left-color: var(--primary);
        }

        .result-item .content strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1.1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .detail-container {
            display: none;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-header h3 {
            margin: 0;
            color: var(--primary);
            font-size: 1.75rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .back-btn,
        .report-btn {
            padding: 0.85rem 1.6rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

        .report-btn {
            background: var(--primary);
            color: white;
        }

        .detail-group {
            margin-bottom: 1.6rem;
        }

        .detail-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .detail-group input,
        .detail-group textarea {
            width: 100%;
            padding: 0.95rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
        }

        .detail-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.8rem 2rem;
            margin-bottom: 2.5rem;
        }

        .results-section h4 {
            color: var(--primary);
            margin: 2.2rem 0 1.4rem;
            font-weight: 700;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.4rem;
        }

        .result-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1.4rem 1.6rem;
            border-left: 5px solid var(--primary-light);
            transition: all 0.25s;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }

        .result-card strong {
            font-size: 1.15rem;
            color: var(--text);
            display: block;
            margin-bottom: 0.6rem;
        }

        .result-card .valor {
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .back {
            background: #6b7280;
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            margin: 2.5rem auto 0;
            display: block;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            max-width: 520px;
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Resultados Finalizados</h1>

        <div class="layout">

          
            <div class="results-list">
                <h3>Solicitudes Finalizadas</h3>
                <div id="resultsList">
                    <p style="text-align:center; color:#777;">Cargando resultados...</p>
                </div>
            </div>

          
            <div class="detail-container" id="detailContainer">
                <div class="detail-header">
                    <h3 id="detailTitle">Detalle del Resultado</h3>
                    <div class="action-buttons">
                        <button class="back-btn" onclick="volverAListaResultados()">Volver a lista</button>
                        <button class="report-btn" onclick="generarReporte()">Generar Reporte</button>
                    </div>
                </div>

                <input type="hidden" id="detailSolicitudId">

                <div class="info-grid">
                    <div class="detail-group">
                        <label>Paciente</label>
                        <input type="text" id="detailPaciente" readonly>
                    </div>
                    <div class="detail-group">
                        <label>Estudio</label>
                        <input type="text" id="detailTipo" readonly>
                    </div>
                    <div class="detail-group">
                        <label>Fecha de recepción</label>
                        <input type="text" id="detailFechaRecepcion" readonly>
                    </div>
                    <div class="detail-group">
                        <label>Fecha de reporte</label>
                        <input type="text" id="detailFechaReporte" readonly>
                    </div>
                    <div class="detail-group" style="grid-column: 1 / -1;">
                        <label>Observaciones generales</label>
                        <textarea id="detailObservaciones" readonly></textarea>
                    </div>
                </div>

                <div class="results-section">
                    <h4>Resultados</h4>
                    <div class="results-grid" id="detailResultsGrid"></div>
                </div>
            </div>

        </div>

        <button class="back" onclick="volver()">Volver al Dashboard</button>
    </div>

    <script>
        window.addEventListener('pywebviewready', async () => {
            try {
                const finalizadas = await window.pywebview.api.obtenerSolicitudesFinalizadas() || [];
                renderResultadosFinalizados(finalizadas);
            } catch (err) {
                console.error("Error al cargar resultados:", err);
                document.getElementById("resultsList").innerHTML =
                    "<p style='color:#ef4444; text-align:center;'>Error al cargar resultados</p>";
            }
        }, { once: true });

        function renderResultadosFinalizados(finalizadas) {
            const lista = document.getElementById("resultsList");
            lista.innerHTML = "";

            if (finalizadas.length === 0) {
                lista.innerHTML = "<p style='text-align:center; color:#777;'>No hay resultados finalizados aún.</p>";
                return;
            }

            finalizadas.forEach(r => {
                const item = document.createElement("div");
                item.className = "result-item";
                item.dataset.id = r.id;

                item.innerHTML = `
                    <div class="result-item-header">
                        <div class="content">
                            <strong>${r.paciente_nombre || 'Paciente desconocido'}</strong>
                            <small>ID Muestra: ${r.id_muestra || '—'}</small><br>
                            <small>Estudio: ${r.tipo_estudio}</small><br>
                            <small>Fecha: ${r.fecha_reporte || '—'}</small>
                        </div>
                        <button class="delete-btn" onclick="event.stopPropagation(); confirmarEliminarSolicitudFinalizada(${r.id})">
                            Eliminar
                        </button>
                    </div>
                `;

                item.querySelector(".content").addEventListener("click", () => cargarDetalleResultado(r.id));
                lista.appendChild(item);
            });
        }

        async function cargarDetalleResultado(id) {
            try {
                const data = await window.pywebview.api.obtenerSolicitud(id);
                if (!data) return alert("No se pudo cargar el detalle");

                document.getElementById("detailSolicitudId").value = id;
                document.getElementById("detailTitle").textContent = `Detalle - ${data.solicitud.tipo_estudio}`;
                document.getElementById("detailPaciente").value = data.solicitud.paciente_nombre || '—';
                document.getElementById("detailTipo").value = data.solicitud.tipo_estudio || '—';
                document.getElementById("detailFechaRecepcion").value = data.solicitud.fecha_recepcion || '—';
                document.getElementById("detailFechaReporte").value = data.solicitud.fecha_reporte || '—';
                document.getElementById("detailObservaciones").value = data.solicitud.observaciones_generales || 'Sin observaciones';

                const grid = document.getElementById("detailResultsGrid");
                grid.innerHTML = "";

                if (data.resultados && data.resultados.length > 0) {
                    data.resultados.forEach(res => {
                        const card = document.createElement("div");
                        card.className = "result-card";
                        card.innerHTML = `
                            <strong>${res.parametro}</strong>
                            <div class="valor">${res.resultado !== null ? res.resultado : '—'}</div>
                            <div class="unidad">${res.unidades || ''}</div>
                            <div class="referencia">Referencia: ${res.valor_referencia || '—'}</div>
                            <div class="observacion">${res.observacion || 'Ninguna'}</div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p style="text-align:center; color:#777; padding: 3rem 0;">No hay parámetros registrados.</p>';
                }

                document.getElementById("detailContainer").style.display = "block";

            } catch (err) {
                console.error(err);
                alert("Error al cargar detalle");
            }
        }

        async function confirmarEliminarSolicitudFinalizada(solicitudId) {
            if (!confirm("¿Realmente deseas ELIMINAR esta solicitud finalizada?")) return;

            try {
                const exito = await window.pywebview.api.eliminarSolicitud(solicitudId);
                if (exito) {
                    alert("Solicitud eliminada correctamente");
                    const finalizadas = await window.pywebview.api.obtenerSolicitudesFinalizadas() || [];
                    renderResultadosFinalizados(finalizadas);
                    document.getElementById("detailContainer").style.display = "none";
                } else {
                    alert("No se pudo eliminar la solicitud");
                }
            } catch (err) {
                console.error(err);
                alert("Error al eliminar");
            }
        }

        async function generarReporte() {
            const solicitudId = document.getElementById("detailSolicitudId").value;
            if (!solicitudId) return alert("No hay solicitud seleccionada");

            try {
                const ruta = await window.pywebview.api.generarReporteFinalizado(solicitudId);
                if (ruta) {
                    alert("Reporte generado correctamente en:\n" + ruta);
                } else {
                    alert("No se pudo generar el reporte");
                }
            } catch (err) {
                console.error(err);
                alert("Error al generar el reporte");
            }
        }

        function volverAListaResultados() {
            document.getElementById("detailContainer").style.display = "none";
        }

        function volver() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>

</html>
