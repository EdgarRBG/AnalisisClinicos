<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Resultados Finalizados - Analitic Laboratorio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-900: #111827;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background: var(--gray-50);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--gray-900);
            margin: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2.5rem;
            letter-spacing: -0.025em;
        }

        .layout {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 2rem;
        }

        .results-list {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.8rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
            max-height: 85vh;
            overflow-y: auto;
            position: sticky;
            top: 2rem;
            align-self: start;
        }

        .results-list h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
        }

        .result-item {
            padding: 1.3rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: var(--radius-md);
            background: var(--gray-50);
            cursor: pointer;
            transition: all 0.25s ease;
            border-left: 4px solid transparent;
            border: 1px solid var(--gray-200);
            position: relative;
        }

        .result-item:hover,
        .result-item.selected {
            background: white;
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-left-color: var(--primary-light);
        }

        .result-item .result-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .result-item .content {
            flex: 1;
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 90px;
            text-align: center;
        }

        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        .detail-container {
            background: white;
            border-radius: var(--radius-lg);
            padding: 2.2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
        }

        .detail-header h3 {
            margin: 0;
            font-size: 1.9rem;
            color: var(--primary);
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .back-btn,
        .print-btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }

        .back-btn {
            background: var(--gray-600);
            color: white;
        }

        .print-btn {
            background: var(--primary);
            color: white;
        }

        .print-btn:hover {
            background: var(--primary-dark);
        }

        .detail-group {
            margin-bottom: 1.6rem;
        }

        .detail-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--gray-600);
            font-size: 0.95rem;
        }

        .detail-group input,
        .detail-group textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            background: var(--gray-50);
            font-size: 1.05rem;
            color: var(--gray-900);
        }

        .detail-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem 2rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.8rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .info-item.full-width {
            grid-column: 1 / -1;
        }

        .results-section h4 {
            font-size: 1.55rem;
            color: var(--primary);
            margin: 2rem 0 1.4rem;
            font-weight: 700;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.3rem 1.4rem;
        }

        .result-card {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 1.35rem 1.5rem;
            border-left: 5px solid var(--success);
            border: 1px solid var(--gray-200);
            transition: all 0.22s ease;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            background: white;
        }

        .result-card strong {
            font-size: 1.14rem;
            font-weight: 600;
            color: var(--gray-900);
            display: block;
            margin-bottom: 0.8rem;
        }

        .result-card .valor {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--gray-900);
            margin: 0.3rem 0;
        }

        .result-card .unidad {
            font-size: 1rem;
            color: var(--gray-600);
            font-weight: 500;
            margin-bottom: 0.6rem;
        }

        .result-card .referencia,
        .result-card .observacion {
            font-size: 0.92rem;
            color: var(--gray-600);
        }

        .result-card .observacion {
            margin-top: 0.7rem;
            line-height: 1.4;
        }

        .result-card .observacion::before {
            content: "📥 ";
            opacity: 0.7;
        }

        @media (max-width: 1100px) {
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .detail-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .action-buttons {
                width: 100%;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }

        .back {
            background: var(--gray-600);
            color: white;
            padding: 0.9rem 2.5rem;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1.05rem;
            margin: 3rem auto 0;
            display: block;
            font-weight: 600;
        }

        .back:hover {
            background: var(--gray-700);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Resultados Finalizados</h1>

        <div class="layout">

            <div class="results-list">
                <h3>Solicitudes Finalizadas</h3>
                <div id="resultsList">
                    <p style="text-align:center; color:var(--gray-600);">Cargando resultados...</p>
                </div>
            </div>

            <div class="detail-container" id="detailContainer" style="display:none;">
                <div class="detail-header">
                    <h3 id="detailTitle">Detalle del Resultado</h3>
                    <div class="action-buttons">
                        <button class="back-btn" onclick="volverAListaResultados()">Volver a lista</button>
                        <button class="print-btn" onclick="imprimirResultado()">Imprimir resultado</button>
                    </div>
                </div>

                <input type="hidden" id="detailSolicitudId">

                <div class="info-grid">
                    <div class="detail-group info-item">
                        <label>Paciente</label>
                        <input type="text" id="detailPaciente" readonly>
                    </div>

                    <div class="detail-group info-item">
                        <label>Estudio</label>
                        <input type="text" id="detailTipo" readonly>
                    </div>

                    <div class="detail-group info-item">
                        <label>Fecha de recepción</label>
                        <input type="text" id="detailFechaRecepcion" readonly>
                    </div>

                    <div class="detail-group info-item">
                        <label>Fecha de reporte</label>
                        <input type="text" id="detailFechaReporte" readonly>
                    </div>

                    <div class="detail-group info-item full-width">
                        <label>Observaciones generales</label>
                        <textarea id="detailObservaciones" readonly></textarea>
                    </div>
                </div>

                <div class="results-section">
                    <h4>Resultados</h4>
                    <div class="results-grid" id="detailResultsGrid"></div>
                </div>
            </div>

        </div>

        <button class="back" onclick="volver()">Volver al Dashboard</button>
    </div>

    <script>
        window.addEventListener('pywebviewready', async () => {
            try {
                const finalizadas = await window.pywebview.api.obtenerSolicitudesFinalizadas() || [];
                renderResultadosFinalizados(finalizadas);
            } catch (err) {
                console.error("Error al cargar resultados:", err);
                document.getElementById("resultsList").innerHTML =
                    "<p style='color:var(--danger); text-align:center;'>Error al cargar resultados</p>";
            }
        }, { once: true });

        function renderResultadosFinalizados(finalizadas) {
            const lista = document.getElementById("resultsList");
            lista.innerHTML = "";

            if (finalizadas.length === 0) {
                lista.innerHTML = "<p style='text-align:center; color:var(--gray-600);'>No hay resultados finalizados aún.</p>";
                return;
            }

            finalizadas.forEach(r => {
                const item = document.createElement("div");
                item.className = "result-item";
                item.dataset.id = r.id;

                item.innerHTML = `
                    <div class="result-item-header">
                        <div class="content">
                            <strong>${r.paciente_nombre || 'Paciente desconocido'}</strong>
                            <small>ID Muestra: ${r.id_muestra || '—'}</small>
                            <small>Estudio: ${r.tipo_estudio}</small>
                            <small>Fecha reporte: ${r.fecha_reporte || '—'}</small>
                        </div>
                        <button class="delete-btn" onclick="event.stopPropagation(); confirmarEliminarSolicitudFinalizada(${r.id})">
                            Eliminar
                        </button>
                    </div>
                `;

                item.querySelector(".content").addEventListener("click", () => cargarDetalleResultado(r.id));
                lista.appendChild(item);
            });
        }

        async function confirmarEliminarSolicitudFinalizada(solicitudId) {
            if (!confirm("¿Realmente deseas ELIMINAR esta solicitud finalizada?\n\nSe borrarán todos los resultados asociados y esta acción NO se puede deshacer.")) {
                return;
            }

            try {
                const exito = await window.pywebview.api.eliminarSolicitud(solicitudId);
                if (exito) {
                    alert("Solicitud finalizada eliminada correctamente");
                    const finalizadas = await window.pywebview.api.obtenerSolicitudesFinalizadas() || [];
                    renderResultadosFinalizados(finalizadas);
                    document.getElementById("detailContainer").style.display = "none";
                } else {
                    alert("No se pudo eliminar la solicitud");
                }
            } catch (err) {
                console.error("Error al eliminar solicitud finalizada:", err);
                alert("Error al intentar eliminar. Revisa la consola.");
            }
        }

        async function cargarDetalleResultado(id) {
            try {
                const data = await window.pywebview.api.obtenerSolicitud(id);
                if (!data) {
                    alert("No se pudo cargar el detalle del resultado");
                    return;
                }

                document.getElementById("detailSolicitudId").value = id;
                document.getElementById("detailTitle").textContent = `Detalle - ${data.solicitud.tipo_estudio}`;
                document.getElementById("detailPaciente").value = data.solicitud.paciente_nombre || '—';
                document.getElementById("detailTipo").value = data.solicitud.tipo_estudio || '—';
                document.getElementById("detailFechaRecepcion").value = data.solicitud.fecha_recepcion || '—';
                document.getElementById("detailFechaReporte").value = data.solicitud.fecha_reporte || '—';
                document.getElementById("detailObservaciones").value = data.solicitud.observaciones_generales || 'Sin observaciones';

                const grid = document.getElementById("detailResultsGrid");
                grid.innerHTML = "";

                if (data.resultados && data.resultados.length > 0) {
                    data.resultados.forEach(res => {
                        const card = document.createElement("div");
                        card.className = "result-card";
                        card.innerHTML = `
                            <strong>${res.parametro}</strong>
                            <div class="valor">${res.resultado !== null ? res.resultado : '—'}</div>
                            <div class="unidad">${res.unidades || ''}</div>
                            <div class="referencia">Referencia: ${res.valor_referencia || '—'}</div>
                            <div class="observacion">${res.observacion || 'Ninguna'}</div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:var(--gray-600); padding: 3rem 0;">No hay parámetros registrados.</p>';
                }

                document.getElementById("detailContainer").style.display = "block";

            } catch (err) {
                console.error("Error al cargar detalle:", err);
                alert("Error al cargar el detalle del resultado");
            }
        }

        function volverAListaResultados() {
            document.getElementById("detailContainer").style.display = "none";
        }

        function imprimirResultado() {
            window.print();
        }

        function volver() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>

</html>
