<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analitic - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --bg: #f5f9f0;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --shadow: 0 25px 60px rgba(46, 125, 50, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f9f0, #e8f5e9);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

      
        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 1000px; 
            height: 600px;
            border-radius: 40px;
            box-shadow: var(--shadow);
            display: flex;
            overflow: hidden; 
            animation: fadeIn 0.8s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

       
        .login-left {
            flex: 1;
            background: #fcfdfc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-right: 1px solid #f0f4f0;
        }

        .login-left img {
            max-width: 80%;
            max-height: 70%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
        }

        .login-left h2 {
            margin-top: 20px;
            font-size: 5.5rem;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: -1.5px;
        }

        .login-left p {
            font-size: 2.2rem;
            color: var(--primary-light);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

       
        .login-right {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .login-right h3 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .material-symbols-outlined {
            position: absolute;
            left: 20px;
            color: var(--primary-light);
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 18px 18px 18px 60px;
            border: 2px solid #f0f4f0;
            border-radius: 20px;
            font-size: 1.1rem;
            background: #fcfdfc;
            transition: all 0.3s ease;
            font-family: inherit;
            color: var(--text-main);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 12px 30px rgba(46, 125, 50, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.3);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        #error {
            color: #e74c3c;
            font-size: 0.95rem;
            margin-top: 20px;
            font-weight: 600;
            min-height: 24px;
        }

      
        @media (max-width: 850px) {
            .login-left { display: none; }
            .login-card { max-width: 450px; }
        }
    </style>
    <script src="/static/js/api.js"></script>
</head>

<body>

    <div class="login-card">
     
        <div class="login-left">
          <img src="/static/Assets/Logo.png" alt="Logo Analitic">
            <h2>Analitic</h2>
            <p>Laboratorio</p>
        </div>

      
        <div class="login-right">
            <h3>Iniciar Sesión</h3>

            <div class="form-group">
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">person</span>
                    <input id="user" type="text" placeholder="Usuario">
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">lock</span>
                    <input id="pass" type="password" placeholder="Contraseña">
                </div>
            </div>

            <button class="login-btn" onclick="login()">
                Entrar al Sistema
            </button>

            <p id="error"></p>
        </div>
    </div>

    <script>
        function login() {
            const usuario = document.getElementById("user").value.trim();
            const contraseña = document.getElementById("pass").value.trim();
            const errorElement = document.getElementById("error");

            errorElement.innerText = "";

            if (!usuario || !contraseña) {
                errorElement.innerText = "Ingresa tus credenciales";
                return;
            }

            window.pywebview.api.login(usuario, contraseña)
                .then(respuesta => {
                    if (respuesta && respuesta.ok) {
                        localStorage.setItem("rolUsuario", respuesta.rol);
                        localStorage.setItem("usuarioLogueado", usuario);
                        window.location.href = "/dashboard";
                    } else {
                        errorElement.innerText = "Datos incorrectos";
                    }
                })
                .catch(() => {
                    errorElement.innerText = "Error de conexión";
                });
        }

        
        const params = new URLSearchParams(window.location.search);
        if (params.get("expired") === "1") {
            const err = document.getElementById("error");
            if (err) err.innerText = "⏰ Tu sesión expiró. Inicia sesión nuevamente.";
        }
