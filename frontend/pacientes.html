<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - Analitic Laboratorio Clínico</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --accent: #a5d6a7;
            --bg: #f5f9f0;
            --white: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 20px 60px rgba(46, 125, 50, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f9f0, #e8f5e9);
            color: var(--text-main);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

    
        .btn-backup {
            background: #2196f3 !important;
            border-color: #1e88e5 !important;
        }

        .btn-backup:hover {
            background: #1e88e5 !important;
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
        }

        .btn-restore {
            background: #ff9800 !important;
            border-color: #f57c00 !important;
        }

        .btn-restore:hover {
            background: #f57c00 !important;
            box-shadow: 0 8px 20px rgba(255, 152, 0, 0.3);
        }

        .container {
            padding: 40px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 40px;
            align-items: start;
        }

        .panel-registro {
            background: var(--white);
            border-radius: 30px;
            padding: 35px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: sticky;
            top: 120px;
      
            max-height: calc(100vh - 160px);
            display: flex;
            flex-direction: column;
        }

        .panel-registro h3 {
            color: var(--primary-dark);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

      
        .form-container-scroll {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
            margin-bottom: 10px;
        }

   
        .form-container-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .form-container-scroll::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-left: 4px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            font-size: 1rem;
            background: #f8fafc;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--text-main);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.08);
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .btn-save {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
            transition: all 0.3s;
        }

        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
        }

        .panel-lista {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .search-bar {
            background: var(--white);
            padding: 10px 10px 10px 25px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .search-bar input {
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 1.1rem;
        }

        .search-bar input:focus {
            box-shadow: none;
        }

        .patients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 25px;
        }

        .patient-card {
            background: var(--white);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.6s ease;
        }

        .patient-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .patient-top {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .patient-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .patient-meta h4 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .patient-meta span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .patient-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-item small {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .detail-item p {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .obs-box {
            background: #fffde7;
            padding: 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            border-left: 5px solid #fbc02d;
            color: #5d4037;
        }

        .patient-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-edit {
            background: #fff8e1;
            color: #f57c00;
        }

        .btn-edit:hover {
            background: #ffecb3;
        }

        .btn-delete {
            background: #ffebee;
            color: #d32f2f;
        }

        .btn-delete:hover {
            background: #ffcdd2;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: white;
            border-radius: 30px;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .modal-header h3 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-modal {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-confirm {
            background: var(--primary);
            color: white;
        }

        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="/static/js/api.js"></script>
</head>

<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p style="font-weight: 700; color: var(--primary-dark);">Procesando información...</p>
    </div>

    <div class="header">
        <h1><span class="material-symbols-outlined"
                style="vertical-align: middle; font-size: 2rem;">biotech</span> Analitic</h1>
        <div class="header-actions">
            <button class="btn-header btn-backup" onclick="respaldarPacientes()">
                <span class="material-symbols-outlined">cloud_upload</span> Respaldar
            </button>
            <button class="btn-header btn-restore" onclick="restaurarPacientes()">
                <span class="material-symbols-outlined">settings_backup_restore</span> Restaurar
            </button>
            <button class="btn-header" onclick="volver()">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </button>
        </div>
    </div>

    <div class="container">
        <div class="layout">
            <div class="panel-registro">
                <h3><span class="material-symbols-outlined">person_add</span> Nuevo Registro</h3>
                
               
                <div class="form-container-scroll">
                    <div class="form-group"><label>NOMBRE COMPLETO</label><input id="nombre" type="text"
                            placeholder="Ej: Juan Pérez" oninput="soloLetras(this)"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group"><label>EDAD</label><input id="edad" type="text" maxlength="3"
                                oninput="soloNumeros(this)"></div>
                        <div class="form-group"><label>SEXO</label><select id="sexo">
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                            </select></div>
                    </div>
                    <div class="form-group"><label>FECHA DE NACIMIENTO</label><input id="fechaNacimiento" type="date"></div>
                    <div class="form-group"><label>TELÉFONO</label><input id="telefono" type="text" maxlength="10"
                            oninput="soloNumeros(this)"></div>
                    <div class="form-group"><label>CORREO ELECTRÓNICO</label><input id="correo" type="email"></div>
                    <div class="form-group"><label>DIRECCIÓN</label><input id="direccion" type="text"></div>
                    <div class="form-group"><label>OBSERVACIONES</label><textarea id="observaciones"></textarea></div>
                </div>

                <button class="btn-save" onclick="guardarPaciente()">Guardar Paciente</button>
            </div>

            <div class="panel-lista">
                <div class="search-bar">
                    <span class="material-symbols-outlined">search</span>
                    <input type="text" placeholder="Buscar por nombre o teléfono..."
                        onkeyup="buscarPaciente(this.value)">
                </div>
                <div class="patients-grid" id="listaPacientes"></div>
            </div>
        </div>
    </div>

  
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar Paciente</h3>
            </div>
            <div id="modalContent">
                <div class="form-group"><label>NOMBRE COMPLETO</label><input id="editNombre" type="text"
                        oninput="soloLetras(this)"></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group"><label>EDAD</label><input id="editEdad" type="text" maxlength="3"
                            oninput="soloNumeros(this)"></div>
                    <div class="form-group"><label>SEXO</label><select id="editSexo">
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                        </select></div>
                </div>
                <div class="form-group"><label>FECHA DE NACIMIENTO</label><input id="editFechaNacimiento" type="date">
                </div>
                <div class="form-group"><label>TELÉFONO</label><input id="editTelefono" type="text" maxlength="10"
                        oninput="soloNumeros(this)"></div>
                <div class="form-group"><label>CORREO ELECTRÓNICO</label><input id="editCorreo" type="email"></div>
                <div class="form-group"><label>DIRECCIÓN</label><input id="editDireccion" type="text"></div>
                <div class="form-group"><label>OBSERVACIONES</label><textarea id="editObservaciones"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal btn-cancel" onclick="cerrarEditModal()">Cancelar</button>
                <button class="btn-modal btn-confirm" onclick="guardarEdicion()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    
    <div id="deleteModal" class="modal-overlay">
        <div class="modal" style="max-width:450px; padding:30px;">
            <div class="modal-header">
                <h3>Eliminar Paciente</h3>
            </div>
            <div
                style="background:#fff1f2; color:#be123c; padding:20px; border-radius:20px; margin:20px 0; text-align:center;">
                ¿Seguro de eliminar a <b id="deleteName"></b>?<br><small>Esta acción es irreversible.</small>
            </div>
            <div class="form-group"><label>CONTRASEÑA ADMIN</label><input id="adminPassword" type="password"></div>
            <p id="deleteError" style="color:red; font-size:0.8rem; display:none;"></p>
            <div class="modal-footer" style="background:none; border:none; padding:0;">
                <button class="btn-modal btn-cancel" onclick="cerrarDeleteModal()">Cancelar</button>
                <button class="btn-modal btn-confirm" style="background:#ef4444;"
                    onclick="confirmarEliminarConPassword()">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        let allPacientes = [];
        let pacienteEditId = null;
        let pacienteDeleteId = null;

        function soloLetras(input) { input.value = input.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ ]/g, ''); }
        function soloNumeros(input) { input.value = input.value.replace(/[^0-9]/g, ''); }

        function limpiarDato(dato) {
            if (dato === null || dato === undefined) return "";
            let str = String(dato).trim();
            const basura = ["nan", "NaN", "Nan", "null", "undefined", "none", "None"];
            if (basura.includes(str)) return "";
            return str;
        }

        async function cargarPacientes() {
            try {
                const data = await window.pywebview.api.obtenerTodosLosPacientes();
                allPacientes = data;
                renderPacientes(data);
            } catch (err) { console.error(err); }
        }

        function renderPacientes(pacientes) {
            const container = document.getElementById("listaPacientes");
            container.innerHTML = "";
            if (!pacientes || pacientes.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #94a3b8;">No hay pacientes registrados.</div>';
                return;
            }
            pacientes.forEach(p => {
                const inicial = (p.nombre || "?").charAt(0).toUpperCase();
                const nombre = limpiarDato(p.nombre) || "Sin nombre";
                const edad = limpiarDato(p.edad);
                const sexo = limpiarDato(p.sexo);
                const tel = limpiarDato(p.telefono);
                const nac = limpiarDato(p.fecha_nacimiento);
                const correo = limpiarDato(p.correo);
                const dir = limpiarDato(p.direccion);
                const obs = limpiarDato(p.observaciones);
                const reg = limpiarDato(p.fecha_registro);

                const card = document.createElement("div");
                card.className = "patient-card";
                card.innerHTML = `
                    <div class="patient-top">
                        <div class="patient-avatar">${inicial}</div>
                        <div class="patient-meta">
                            <h4>${nombre}</h4>
                            <span>ID: #${p.id} ${reg ? '• Registro: ' + reg : ''}</span>
                        </div>
                    </div>
                    <div class="patient-details">
                        <div class="detail-item"><small>Edad / Sexo</small><p>${edad}${edad ? ' años' : ''}${sexo && edad ? ' • ' : ''}${sexo}</p></div>
                        <div class="detail-item"><small>Teléfono</small><p>${tel}</p></div>
                        <div class="detail-item"><small>Nacimiento</small><p>${nac}</p></div>
                        <div class="detail-item"><small>Correo</small><p>${correo}</p></div>
                        <div class="detail-item" style="grid-column: span 2;"><small>Dirección</small><p>${dir}</p></div>
                    </div>
                    ${obs ? `<div class="obs-box"><b>Notas:</b> ${obs}</div>` : ''}
                    <div class="patient-actions">
                        <button class="btn-action btn-edit" onclick="mostrarModalEdicion(${p.id}, '${nombre.replace(/'/g, "\\\\'")}', '${edad}', '${nac}', '${tel}', '${sexo}', '${correo}', '${dir}', '${obs}')">Editar</button>
                        <button class="btn-action btn-delete" onclick="mostrarModalEliminar(${p.id}, '${nombre.replace(/'/g, "\\\\'")}')">Eliminar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function buscarPaciente(t) {
            const term = t.toLowerCase().trim();
            renderPacientes(allPacientes.filter(p => (p.nombre || '').toLowerCase().includes(term) || (p.telefono || '').includes(term)));
        }

        async function guardarPaciente() {
            const n = document.getElementById("nombre").value.trim();
            const e = document.getElementById("edad").value.trim();
            const t = document.getElementById("telefono").value.trim();
            if (!n || !e || !t) { alert("Llena los campos obligatorios"); return; }
            const res = await window.pywebview.api.guardarPaciente(n, parseInt(e), t, document.getElementById("sexo").value, document.getElementById("correo").value, document.getElementById("direccion").value, document.getElementById("observaciones").value, document.getElementById("fechaNacimiento").value);
            if (res.ok) { location.reload(); }
        }

        function mostrarModalEdicion(id, n, e, fn, t, s, c, d, o) {
            pacienteEditId = id;
            document.getElementById("editNombre").value = n;
            document.getElementById("editEdad").value = e;
            document.getElementById("editFechaNacimiento").value = fn;
            document.getElementById("editTelefono").value = t;
            document.getElementById("editSexo").value = s;
            document.getElementById("editCorreo").value = c;
            document.getElementById("editDireccion").value = d;
            document.getElementById("editObservaciones").value = o;
            document.getElementById("editModal").style.display = "flex";
        }

        function cerrarEditModal() { document.getElementById("editModal").style.display = "none"; }

        async function guardarEdicion() {
            const res = await window.pywebview.api.editarPaciente(pacienteEditId, document.getElementById("editNombre").value, parseInt(document.getElementById("editEdad").value), document.getElementById("editTelefono").value, document.getElementById("editSexo").value, document.getElementById("editCorreo").value, document.getElementById("editDireccion").value, document.getElementById("editObservaciones").value, document.getElementById("editFechaNacimiento").value);
            if (res) { location.reload(); }
        }

        function mostrarModalEliminar(id, n) {
            pacienteDeleteId = id;
            document.getElementById("deleteName").innerText = n;
            document.getElementById("deleteModal").style.display = "flex";
        }

        function cerrarDeleteModal() { document.getElementById("deleteModal").style.display = "none"; }

        async function confirmarEliminarConPassword() {
            const res = await window.pywebview.api.eliminarPaciente(pacienteDeleteId, document.getElementById("adminPassword").value);
            if (res.ok) { location.reload(); } else { alert(res.error); }
        }

        async function respaldarPacientes() {
            document.getElementById("loadingOverlay").style.display = "flex";
            try {
                const resp = await fetch("/api/descargar_respaldo", { credentials: "include" });
                if (!resp.ok) { alert("Error al generar respaldo"); return; }
                const blob = await resp.blob();
                const header = resp.headers.get("Content-Disposition") || "";
                const match = header.match(/filename="?([^"]+)"?/);
                const nombre = match ? match[1] : "Respaldo_Pacientes.xlsx";
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = nombre; a.cl
