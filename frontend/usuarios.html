<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Analitic</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --accent: #a5d6a7;
            --bg: #f5f9f0;
            --card-bg: rgba(255, 255, 255, 0.98);
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 20px 60px rgba(46, 125, 50, 0.15);
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --danger: #ef5350;
            --warning: #ffa726;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f9f0, #e8f5e9);
            color: var(--text-main);
            min-height: 100vh;
            padding-top: 120px;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .nav-left { display: flex; align-items: center; gap: 20px; }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .logo-name { color: white; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-section h1 {
            font-size: 2.8rem;
            color: var(--primary-dark);
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 40px;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 35px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-strong);
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-group { position: relative; margin-bottom: 24px; }
        
        .form-group label {
            position: absolute;
            top: 14px;
            left: 16px;
            color: #757575;
            font-size: 1rem;
            transition: all 0.3s;
            pointer-events: none;
        }

        .form-group input:focus+label,
        .form-group input:not(:placeholder-shown)+label,
        .form-group select:focus+label,
        .form-group select:not(:placeholder-shown)+label {
            top: -8px;
            left: 12px;
            font-size: 0.85rem;
            color: var(--primary);
            background: white;
            padding: 0 6px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #f1f5f9;
            border-radius: 18px;
            font-size: 1rem;
            background: #f8fafc;
            transition: 0.3s;
            color: var(--text-main);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .user-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #f1f5f9;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-soft);
            border-color: var(--accent);
        }

        .user-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 100%;
            background: var(--primary-light);
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
        }

        .user-info h4 { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }
        
        .role-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .role-admin { background: #e3f2fd; color: #1976d2; }
        .role-laboratorista { background: #e8f5e9; color: #2e7d32; }
        .role-recepcion { background: #fff3e0; color: #f57c00; }
        .role-capturista { background: #f5f5f5; color: #616161; }

        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #f1f5f9;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.3s;
        }

        .btn-edit { background: #fff8e1; color: #ffa000; }
        .btn-edit:hover { background: #ffecb3; }
        .btn-delete { background: #ffebee; color: #ef5350; }
        .btn-delete:hover { background: #ffcdd2; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h3 {
            font-size: 1.8rem;
            color: var(--primary-dark);
            font-weight: 900;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-modal {
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-cancel { background: #f1f5f9; color: var(--text-muted); }
        .btn-cancel:hover { background: #e2e8f0; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
    <script src="/static/js/api.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <span class="material-symbols-outlined" style="color:white; font-size:30px;">group</span>
                <span class="logo-name">Analitic Usuarios</span>
            </div>
        </div>
        <button class="btn-back" onclick="volver()">
            <span class="material-symbols-outlined">arrow_back</span>
            Dashboard
        </button>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Panel de Control de Personal</h1>
        </div>

        <div class="layout">
            <div class="card">
                <h3><span class="material-symbols-outlined">person_add</span> Nuevo Usuario</h3>
                <div class="form-group">
                    <input id="nuevoUsuario" type="text" placeholder=" " required>
                    <label for="nuevoUsuario">Nombre de usuario *</label>
                </div>
                <div class="form-group">
                    <input id="nuevaContrasena" type="password" placeholder=" " required>
                    <label for="nuevaContrasena">Contraseña *</label>
                </div>
                <div class="form-group">
                    <select id="nuevoRol" required>
                        <option value="" disabled selected>Selecciona rol</option>
                        <option value="admin">Admin</option>
                        <option value="recepcion">Recepción</option>
                        <option value="laboratorista">Laboratorista</option>
                        <option value="capturista">Capturista</option>
                    </select>
                    <label for="nuevoRol">Rol *</label>
                </div>
                <button class="btn-primary" onclick="crearUsuario()">
                    <span class="material-symbols-outlined">save</span>
                    Registrar Usuario
                </button>
            </div>

            <div class="users-grid" id="listaUsuarios">
             
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Usuario</h3>
            </div>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <input id="editUsuario" type="text" disabled style="background:#f1f5f9;">
                <label for="editUsuario">Usuario</label>
            </div>
            <div class="form-group">
                <input id="editNuevaContrasena" type="password" placeholder=" ">
                <label for="editNuevaContrasena">Nueva contraseña (opcional)</label>
            </div>
            <div class="form-group">
                <select id="editRol">
                    <option value="admin">Admin</option>
                    <option value="recepcion">Recepción</option>
                    <option value="laboratorista">Laboratorista</option>
                    <option value="capturista">Capturista</option>
                </select>
                <label for="editRol">Rol</label>
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="cerrarModal('editModal')">Cancelar</button>
                <button class="btn-modal btn-primary" onclick="guardarEdicionUsuario()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="material-symbols-outlined" style="font-size:60px; color:var(--danger); margin-bottom:15px;">warning</span>
                <h3>¿Eliminar Usuario?</h3>
                <p style="color:var(--text-muted); font-weight:600; margin-top:10px;">Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="cerrarModal('deleteModal')">No, Cancelar</button>
                <button class="btn-modal btn-primary" style="background:var(--danger);" onclick="eliminarUsuario()">Sí, Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        let usuarios = [];
        let userEditId = null;
        let userDeleteId = null;

        window.addEventListener('pywebviewready', async () => {
            cargarUsuarios();
        }, { once: true });

        async function cargarUsuarios() {
            try {
                usuarios = await window.pywebview.api.obtenerUsuarios() || [];
                renderUsuarios();
            } catch (err) {
                console.error("Error al cargar usuarios:", err);
                document.getElementById("listaUsuarios").innerHTML = "<p style='text-align:center; color:#777;'>Error al cargar usuarios</p>";
            }
        }

        function renderUsuarios() {
            const lista = document.getElementById("listaUsuarios");
            lista.innerHTML = "";

            if (usuarios.length === 0) {
                lista.innerHTML = "<p style='text-align:center; color:#777; padding:30px; grid-column: 1/-1;'>No hay usuarios registrados aún.</p>";
                return;
            }

            usuarios.forEach(u => {
                const inicial = u.usuario.charAt(0).toUpperCase();
                const rolClass = `role-${u.rol.toLowerCase()}`;
                const card = document.createElement("div");
                card.className = "user-card";
                card.innerHTML = `
                    <div class="user-header">
                        <div class="user-avatar">${inicial}</div>
                        <div class="user-info">
                            <h4>${u.usuario}</h4>
                            <span class="role-badge ${rolClass}">${u.rol}</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        <button class="btn-action btn-edit" onclick="mostrarModalEdicion(${u.id}, '${u.usuario.replace(/'/g, "\\'")}', '${u.rol}')">
                            <span class="material-symbols-outlined" style="font-size:18px;">edit</span> Editar
                        </button>
                        <button class="btn-action btn-delete" onclick="confirmarEliminarUsuario(${u.id})">
                            <span class="material-symbols-outlined" style="font-size:18px;">delete</span> Borrar
                        </button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        async function crearUsuario() {
            const usuario = document.getElementById("nuevoUsuario").value.trim();
            const contrasena = document.getElementById("nuevaContrasena").value.trim();
            const rol = document.getElementById("nuevoRol").value;

            if (!usuario || !contrasena || !rol) {
                alert("Completa todos los campos");
                return;
            }

            try {
                const exito = await window.pywebview.api.crearUsuario(usuario, contrasena, rol);
                if (exito) {
                    alert("Usuario creado con éxito");
                    document.getElementById("nuevoUsuario").value = "";
                    document.getElementById("nuevaContrasena").value = "";
                    document.getElementById("nuevoRol").value = "";
                    cargarUsuarios();
                } else {
                    alert("No se pudo crear el usuario");
                }
            } catch (err) {
                console.error("Error al crear usuario:", err);
                alert("Error al conectar con el sistema");
            }
        }

        function mostrarModalEdicion(id, usuario, rol) {
            userEditId = id;
            document.getElementById("editUserId").value = id;
            document.getElementById("editUsuario").value = usuario;
            document.getElementById("editNuevaContrasena").value = "";
            document.getElementById("editRol").value = rol;
            document.getElementById("editModal").style.display = "flex";
        }

        async function guardarEdicionUsuario() {
            const nuevaContrasena = document.getElementById("editNuevaContrasena").value.trim();
            const nuevoRol = document.getElementById("editRol").value;

            if (!nuevoRol) {
                alert("El rol es obligatorio");
                return;
            }

            try {
                let exito = true;
                if (nuevaContrasena) {
                    exito = exito && await window.pywebview.api.actualizarContrasenaUsuario(userEditId, nuevaContrasena);
                }
                exito = exito && await window.pywebview.api.actualizarRolUsuario(userEditId, nuevoRol);

                if (exito) {
                    alert("Usuario actualizado");
                    cerrarModal('editModal');
                    cargarUsuarios();
                } else {
                    alert("No se pudo actualizar");
                }
            } catch (err) {
                console.error("Error al editar:", err);
                alert("Error al actualizar");
            }
        }

        function confirmarEliminarUsuario(id) {
            userDeleteId = id;
            document.getElementById("deleteModal").style.display = "flex";
        }

        async function eliminarUsuario() {
            try {
                const exito = await window.pywebview.api.eliminarUsuario(userDeleteId);
                if (exito) {
                    alert("Usuario eliminado");
                    cerrarModal('deleteModal');
                    cargarUsuarios();
                } else {
                    alert("No se pudo eliminar");
                }
            } catch (err) {
                console.error("Error al eliminar:", err);
                alert("Error al eliminar");
            }
        }

        function cerrarModal(id) {
            document.getElementById(id).style.display = "none";
        }

        function volver() {
            window.location.assign("/dashboard");
        }
    </script>

</body>

</html>
