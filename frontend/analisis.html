<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    
    <title>Análisis Clínicos - Analitic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --accent: #a5d6a7;
            --bg: #f5f9f0;
            --card-bg: rgba(255, 255, 255, 0.98);
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 20px 60px rgba(46, 125, 50, 0.2);
            --text-main: #2c3e50;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f9f0, #e8f5e9);
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

       
        .header-section {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section h1 {
            font-size: 2.8rem;
            color: var(--primary-dark);
            font-weight: 900;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .new-btn {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            padding: 16px 32px;
            font-size: 1.1rem;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto 40px;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
        }

        .new-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 125, 50, 0.3);
        }

       
        .layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
            align-items: start;
        }

      
        .panel-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .panel-card h3 {
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pending-item {
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 18px;
            background: rgba(165, 214, 167, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 5px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pending-item:hover,
        .pending-item.selected {
            background: rgba(165, 214, 167, 0.15);
            transform: translateX(5px);
            border-left-color: var(--primary-light);
        }

        .pending-item strong {
            display: block;
            font-size: 1.1rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .pending-item small {
            color: var(--text-muted);
            font-weight: 500;
        }

        .delete-btn-mini {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .delete-btn-mini:hover {
            background: #ef4444;
            color: white;
        }

       
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            font-size: 1rem;
            background: #f8fafc;
            transition: all 0.3s;
            color: var(--text-main);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.08);
        }

       
        .capture-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .capture-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 25px;
            border-radius: 20px;
        }

        .info-item label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 800;
            display: block;
            margin-bottom: 5px;
        }

        .info-item p {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .verification-btn-large {
            width: 100%;
            padding: 25px;
            background: white;
            border: 2px dashed var(--primary-light);
            border-radius: 25px;
            color: var(--primary-dark);
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .verification-btn-large:hover {
            background: rgba(76, 175, 80, 0.05);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .verification-btn-large .material-symbols-outlined {
            font-size: 48px;
            color: var(--primary-light);
        }

        .actions-footer {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-action {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-finish {
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.2);
        }

        .btn-finish:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-back {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-back:hover {
            background: #e2e8f0;
        }

        .back-dashboard {
            margin: 40px auto 0;
            display: block;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-dashboard:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-section">
            <h1>Análisis Clínicos</h1>
            <button class="new-btn" onclick="mostrarNuevaSolicitud()">
                <span class="material-symbols-outlined">add_circle</span>
                Nueva Solicitud de Análisis
            </button>
        </div>

        <div class="layout">
           
            <div class="panel-card">
                <h3><span class="material-symbols-outlined">pending_actions</span> Pendientes</h3>
                <div id="pendingList">
                    <p style="text-align:center; color:#94a3b8; padding:20px;">Cargando...</p>
                </div>
            </div>

         
            <div id="workArea">
             
                <div class="panel-card" id="newSolicitudForm" style="display:none;">
                    <h3><span class="material-symbols-outlined">note_add</span> Nueva Solicitud</h3>

                    <div class="form-group">
                        <label>PACIENTE *</label>
                        <input id="nuevoPaciente" list="pacientesList" placeholder="Buscar por nombre..."
                            autocomplete="off">
                        <datalist id="pacientesList"></datalist>
                        <input type="hidden" id="nuevoPacienteId">
                        <small id="pacienteError" style="color:#ef4444; display:none; margin-top:5px; font-weight:600;">
                            Selecciona un paciente de la lista
                        </small>
                    </div>

                    <div class="form-group">
                        <label>ESTUDIO SOLICITADO *</label>
                        <select id="nuevoTipoEstudio">
                            <option value="" disabled selected>Selecciona un estudio...</option>
                            <option value="Química Sanguínea 35 Elementos">Química Sanguínea 35 Elementos</option>
                            <option value="Perfil Lipídico">Perfil Lipídico</option>
                            <option value="Ácido Úrico">Ácido Úrico</option>
                            <option value="Citometría Hemática Completa">Citometría Hemática Completa</option>
                            <option value="Tiempos de Coagulación">Tiempos de Coagulación</option>
                            <option value="Perfil Tiroideo">Perfil Tiroideo</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>MÉDICO SOLICITANTE</label>
                        <input id="nuevoMedico" type="text" placeholder="Nombre del médico">
                    </div>

                    <div class="form-group">
                        <label>OBSERVACIONES / INDICACIONES</label>
                        <textarea id="nuevasObservaciones" placeholder="Notas adicionales..."></textarea>
                    </div>

                    <div class="actions-footer">
                        <button class="btn-action btn-back" onclick="ocultarNuevaSolicitud()">Cancelar</button>
                        <button class="btn-action btn-finish" onclick="crearNuevaSolicitud()">Crear Solicitud</button>
                    </div>
                </div>

               
                <div class="panel-card" id="formContainer" style="display:none;">
                    <div class="capture-header">
                        <h2 id="solicitudTitle">Captura de Resultados</h2>
                        <span class="material-symbols-outlined"
                            style="color: var(--primary-light); font-size: 32px;">biotech</span>
                    </div>

                    <input type="hidden" id="solicitudId">

                    <div class="info-grid">
                        <div class="info-item">
                            <label>Paciente</label>
                            <p id="displayPaciente">Cargando...</p>
                        </div>
                        <div class="info-item">
                            <label>Estudio</label>
                            <p id="displayEstudio">Cargando...</p>
                        </div>
                        <div class="info-item" style="grid-column: span 2;">
                            <label>Observaciones Generales</label>
                            <p id="displayObservaciones"
                                style="font-weight: 500; font-size: 1rem; color: var(--text-muted);">Ninguna</p>
                        </div>
                    </div>

                  
                    <button class="verification-btn-large" onclick="irAVerificacionDocumentos()">
                        <span class="material-symbols-outlined">upload_file</span>
                        Verificación de Documentos
                        <small style="font-size: 0.9rem; font-weight: 500; opacity: 0.7;">Carga o escanea los resultados
                            aquí</small>
                    </button>

                    <div class="actions-footer">
                        <button class="btn-action btn-back" onclick="volverALista()">
                            <span class="material-symbols-outlined">arrow_back</span> Volver
                        </button>
                        <button class="btn-action btn-finish" onclick="finalizarSolicitud()">
                            <span class="material-symbols-outlined">check_circle</span> Finalizar y Validar
                        </button>
                    </div>
                </div>

              
                <div id="initialMessage" style="text-align: center; padding: 100px 40px; color: #94a3b8;">
                    <span class="material-symbols-outlined"
                        style="font-size: 80px; opacity: 0.2; margin-bottom: 20px;">analytics</span>
                    <p style="font-size: 1.2rem; font-weight: 600;">Selecciona una solicitud para comenzar la captura
                    </p>
                </div>
            </div>
        </div>

        <button class="back-dashboard" onclick="window.location.href='dashboard.html'">
            <span class="material-symbols-outlined">grid_view</span> Volver al Dashboard
        </button>
    </div>

    <script>
        let solicitudesPendientes = [];
        let pacientes = [];

        window.addEventListener('pywebviewready', async () => {
            try {
                pacientes = await window.pywebview.api.obtenerPacientes() || [];
                solicitudesPendientes = await window.pywebview.api.obtenerSolicitudesPendientes() || [];
                renderPacientesDatalist();
                renderSolicitudesPendientes();
            } catch (err) { console.error(err); }
        }, { once: true });

        function renderPacientesDatalist() {
            const datalist = document.getElementById("pacientesList");
            datalist.innerHTML = "";
            pacientes.forEach(p => {
                const option = document.createElement("option");
                option.value = p.nombre;
                option.dataset.id = p.id;
                datalist.appendChild(option);
            });
        }

        document.getElementById("nuevoPaciente").addEventListener("input", function () {
            const input = this.value.trim();
            const selected = Array.from(document.getElementById("pacientesList").options).find(opt => opt.value === input);
            const error = document.getElementById("pacienteError");
            if (selected) {
                document.getElementById("nuevoPacienteId").value = selected.dataset.id;
                error.style.display = "none";
            } else {
                document.getElementById("nuevoPacienteId").value = "";
                if (input.length > 0) error.style.display = "block";
            }
        });

        function renderSolicitudesPendientes() {
            const lista = document.getElementById("pendingList");
            lista.innerHTML = "";
            if (solicitudesPendientes.length === 0) {
                lista.innerHTML = "<p style='text-align:center; color:#94a3b8; padding:20px;'>No hay pendientes.</p>";
                return;
            }
            solicitudesPendientes.forEach(s => {
                const item = document.createElement("div");
                item.className = "pending-item";
                item.innerHTML = `
                    <div onclick="cargarSolicitud(${s.id})">
                        <strong>${s.paciente_nombre || 'Desconocido'}</strong>
                        <small>${s.tipo_estudio}</small>
                    </div>
                    <button class="delete-btn-mini" onclick="confirmarEliminar(${s.id})">
                        <span class="material-symbols-outlined" style="font-size:18px">delete</span>
                    </button>
                `;
                lista.appendChild(item);
            });
        }

        async function cargarSolicitud(id) {
            try {
                const data = await window.pywebview.api.obtenerSolicitud(id);
                if (!data) return;

                document.getElementById("initialMessage").style.display = "none";
                document.getElementById("newSolicitudForm").style.display = "none";
                document.getElementById("formContainer").style.display = "block";

                document.getElementById("solicitudId").value = id;
             
                document.getElementById("displayPaciente").textContent = data.solicitud.paciente_nombre || '—';
                document.getElementById("displayEstudio").textContent = data.solicitud.tipo_estudio || '—';
                document.getElementById("displayObservaciones").textContent = data.solicitud.observaciones_generales || 'Ninguna';

            } catch (err) { console.error(err); }
        }

        function mostrarNuevaSolicitud() {
            document.getElementById("initialMessage").style.display = "none";
            document.getElementById("formContainer").style.display = "none";
            document.getElementById("newSolicitudForm").style.display = "block";
            document.getElementById("nuevoPaciente").value = "";
            document.getElementById("nuevoPacienteId").value = "";
        }

        function ocultarNuevaSolicitud() {
            document.getElementById("newSolicitudForm").style.display = "none";
            document.getElementById("initialMessage").style.display = "block";
        }

        async function crearNuevaSolicitud() {
            const pId = document.getElementById("nuevoPacienteId").value;
            const estudio = document.getElementById("nuevoTipoEstudio").value;
            const medico = document.getElementById("nuevoMedico").value;
            const obs = document.getElementById("nuevasObservaciones").value;

            if (!pId) return alert("Selecciona un paciente.");
            if (!estudio) return alert("Selecciona el estudio.");

            try {
                const res = await window.pywebview.api.registrarSolicitudAnalisis(pId, null, null, medico, estudio, obs);
                if (res) {
                    alert("Solicitud creada.");
                    ocultarNuevaSolicitud();
                    solicitudesPendientes = await window.pywebview.api.obtenerSolicitudesPendientes();
                    renderSolicitudesPendientes();
                }
            } catch (err) { console.error(err); }
        }

        function volverALista() {
            document.getElementById("formContainer").style.display = "none";
            document.getElementById("initialMessage").style.display = "block";
        }

        async function finalizarSolicitud() {
            const id = document.getElementById("solicitudId").value;
            if (confirm("¿Finalizar y validar esta solicitud?")) {
                const ok = await window.pywebview.api.actualizarEstadoSolicitud(id, "finalizado");
                if (ok) window.location.href = "resultados.html";
            }
        }

        async function confirmarEliminar(id) {
            if (confirm("¿Eliminar solicitud?")) {
                const ok = await window.pywebview.api.eliminarSolicitud(id);
                if (ok) {
                    solicitudesPendientes = await window.pywebview.api.obtenerSolicitudesPendientes();
                    renderSolicitudesPendientes();
                    volverALista();
                }
            }
        }

        function irAVerificacionDocumentos() {
            const id = document.getElementById("solicitudId").value;
            window.location.href = `bloques.html?solicitudId=${id}`;
        }
    </script>
</body>

</html>
