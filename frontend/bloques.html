<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Profesionales - Analitic</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #4caf50;
            --accent: #81c784;
            --bg: #f0f4f0;
            --white: #ffffff;
            --text-main: #1a202c;
            --shadow: 0 15px 35px rgba(27, 94, 32, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

      
        .header {
            background: linear-gradient(135deg, var(--primary), #2e7d32);
            color: white;
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-print {
            background: #f59e0b;
            border-color: #d97706;
        }

       
        .main {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .left-panel {
            width: 320px;
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .import-section {
            background: #f0fdf4;
            border: 2px dashed var(--primary-light);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .import-section:hover {
            background: #dcfce7;
        }

        .import-section span {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-top: 5px;
        }

        #bloquesDisponibles {
            flex: 1;
            overflow-y: auto;
        }

        .block {
            background: #f8fafc;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: grab;
            transition: 0.3s;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* DOCUMENT PREVIEW */
        .right-panel {
            flex: 1;
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            background: #fcfdfc;
            margin-bottom: 15px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .preview-container {
            flex: 1;
            background: #94a3b8;
            border-radius: 15px;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

      
        .document-page {
            background: white;
            width: 215.9mm;
            height: 279.4mm;
            padding: 15mm 20mm 25mm 20mm;
           
            position: relative;
            display: flex;
            flex-direction: column;
            color: #000;
            font-size: 13pt;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

     
        .doc-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            width: 100%;
        }

        .doc-logo {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 85px;
            width: auto;
        }

        .header-text {
            text-align: center;
        }

        .header-text h1 {
            font-size: 28pt;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-text p {
            color: var(--primary);
            font-weight: 700;
            font-size: 12pt;
            margin-top: -5px;
        }

        .patient-info {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 8px 30px;
            margin-bottom: 20px;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 4px;
        }

        .info-line {
            font-size: 11pt;
            display: flex;
            gap: 8px;
        }

        .info-line strong {
            font-size: 9pt;
            text-transform: uppercase;
            width: 85px;
        }

        .info-line span {
            font-weight: 800;
        }

        .doctor-input {
            border: none;
            border-bottom: 1px dotted #000;
            background: transparent;
            width: 100%;
            font-size: 11pt;
            font-weight: 800;
            outline: none;
        }

        .page-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .study-title-row {
            background: #eee;
            padding: 6px 12px;
            font-weight: 900;
            font-size: 13pt;
            text-transform: uppercase;
            margin: 15px 0 8px 0;
            display: flex;
            justify-content: space-between;
            border-left: 8px solid var(--primary);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 5px;
        }

        .results-table th {
            text-align: left;
            padding: 8px;
            border-bottom: 2px solid #000;
            font-size: 10pt;
            text-transform: uppercase;
            font-weight: 900;
        }

        .results-table td {
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            font-size: 13pt;
        }

        .param-name {
            font-weight: 700;
            width: 45%;
        }

        .result-input {
            width: 85px;
            padding: 3px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-weight: 900;
            font-size: 13pt;
            font-family: 'Roboto Mono', monospace;
        }

        .signature-block {
            position: absolute;
            bottom: 12mm;
            left: 20mm;
            right: 20mm;
            text-align: center;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .signature-block p {
            font-size: 13pt;
            line-height: 1.3;
        }

        .btn-save-final {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
        }

       
        .page-header-mini {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #000;
            margin-bottom: 15px;
            padding-bottom: 8px;
        }

        .page-header-mini span {
            font-size: 10pt;
            font-weight: 800;
            text-transform: uppercase;
        }

        @media print {
            @page {
                size: letter;
                margin: 0;
            }

            body {
                background: white;
            }

            body * {
                visibility: hidden;
            }

            .preview-container,
            .preview-container * {
                visibility: visible;
            }

            .preview-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
                margin: 0;
                background: none;
                overflow: visible;
            }

            .document-page {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
                border: none;
            }

            .remove-study,
            .btn-save-final,
            .header,
            .left-panel,
            .drop-zone {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Reportes Clínicos Analitic</h2>
        <div class="header-actions">
            <button class="btn-action btn-print" onclick="window.print()">
                <span class="material-symbols-outlined">print</span> Imprimir Reporte
            </button>
            <button class="btn-action" onclick="volver()">
                <span class="material-symbols-outlined">arrow_back</span> Regresar
            </button>
        </div>
    </div>

    <div class="main">
        <div class="left-panel">
            <div class="import-section" onclick="importarCSV()">
                <span class="material-symbols-outlined"
                    style="font-size: 32px; color: var(--primary);">upload_file</span>
                <span>IMPORTAR RESULTADOS CSV</span>
            </div>
            <h3>Estudios Disponibles</h3>
            <div id="bloquesDisponibles"></div>
        </div>

        <div class="right-panel">
            <div id="dropZone" class="drop-zone">
                Arrastre estudios aquí para integrarlos al reporte oficial
            </div>
            <div class="preview-container" id="previewContainer"></div>
            <button class="btn-save-final" onclick="guardarReporte()">Finalizar y Guardar en Sistema</button>
        </div>
    </div>

    <script>
        let estudiosData = [];
        let solicitudId = null;
        let datosPaciente = {};
        let estudiosAgregados = [];

       
        const FILAS_PRIMERA_PAGINA = 13;
        const FILAS_PAGINA_SIGUIENTE = 22; 

        async function inicializar() {
            const params = new URLSearchParams(window.location.search);
            solicitudId = params.get('solicitudId');
            try {
                estudiosData = await window.pywebview.api.obtenerEstudiosDisponibles();
                renderBloques();
                if (solicitudId) {
                    const data = await window.pywebview.api.obtenerSolicitud(solicitudId);
                    if (data && data.solicitud) {
                        datosPaciente = data.solicitud;
                        reconstruirDocumento();
                    }
                }
            } catch (err) { console.error(err); }
        }

        if (window.pywebview) inicializar();
        else window.addEventListener('pywebviewready', inicializar);

        function renderBloques() {
            const container = document.getElementById("bloquesDisponibles");
            container.innerHTML = "";
            estudiosData.forEach(e => {
                const div = document.createElement("div");
                div.className = "block";
                div.draggable = true;
                div.innerHTML = `<span class="material-symbols-outlined">science</span> ${e.nombre}`;
                div.ondragstart = (ev) => ev.dataTransfer.setData("studyId", e.id);
                container.appendChild(div);
            });
        }

        async function importarCSV() {
            const res = await window.pywebview.api.seleccionarYLeerCSV();
            if (res.ok) {
                const datosCsv = res.datos;
                if (estudiosAgregados.length === 0) {
                    const qs35 = JSON.parse(JSON.stringify(estudiosData.find(e => e.id == 1)));
                    estudiosAgregados.push(qs35);
                }
                estudiosAgregados.forEach(est => {
                    est.parametros.forEach(p => {
                        if (datosCsv[p.nombre]) p.val = datosCsv[p.nombre];
                    });
                });
                reconstruirDocumento();
                alert("Resultados importados correctamente.");
            }
        }

        const dropZone = document.getElementById("dropZone");
        dropZone.ondragover = (e) => e.preventDefault();
        dropZone.ondrop = (e) => {
            e.preventDefault();
            const studyId = e.dataTransfer.getData("studyId");
            const estudioOriginal = estudiosData.find(est => est.id == studyId);
            if (estudioOriginal) {
                const estudioClon = JSON.parse(JSON.stringify(estudioOriginal));
                estudiosAgregados.push(estudioClon);
                reconstruirDocumento();
            }
        };

        function reconstruirDocumento() {
            const container = document.getElementById("previewContainer");
            container.innerHTML = "";

            let todasLasFilas = [];
            estudiosAgregados.forEach((estudio, estIdx) => {
                todasLasFilas.push({ type: 'title', content: estudio.nombre, estIdx: estIdx });
                estudio.parametros.forEach((p, pIdx) => {
                    todasLasFilas.push({ type: 'param', data: p, estIdx: estIdx, pIdx: pIdx });
                });
            });

            if (todasLasFilas.length === 0) {
                crearPaginaBase(container, 1);
                actualizarFirma();
                return;
            }

            let filaActual = 0;
            let numPagina = 1;

            while (filaActual < todasLasFilas.length) {
                const limiteFilas = (numPagina === 1) ? FILAS_PRIMERA_PAGINA : FILAS_PAGINA_SIGUIENTE;
                const page = crearPaginaBase(container, numPagina);
                const contentArea = page.querySelector('.page-content');

                let filasEnEstaPagina = 0;
                let currentTable = null;
                let currentTbody = null;

                while (filaActual < todasLasFilas.length && filasEnEstaPagina < limiteFilas) {
                    const item = todasLasFilas[filaActual];
                    if (item.type === 'title') {
                        const titleDiv = document.createElement("div");
                        titleDiv.className = "study-title-row";
                        titleDiv.innerHTML = `<span>${item.content}</span> <button class="remove-study" onclick="removerEstudio(${item.estIdx})">×</button>`;
                        contentArea.appendChild(titleDiv);
                        currentTable = null;
                        filasEnEstaPagina += 3;
                    } else {
                        if (!currentTable) {
                            currentTable = document.createElement("table");
                            currentTable.className = "results-table";
                            currentTable.innerHTML = `<thead><tr><th>Parámetro</th><th>Resultado</th><th>Unidades</th><th>Valores Ref.</th></tr></thead><tbody></tbody>`;
                            contentArea.appendChild(currentTable);
                            currentTbody = currentTable.querySelector("tbody");
                        }
                        const tr = document.createElement("tr");
                        const p = item.data;
                        let refValue = (datosPaciente.paciente_sexo && (datosPaciente.paciente_sexo.toLowerCase().startsWith('f') || datosPaciente.paciente_sexo.toLowerCase().includes('mujer'))) ? p.referencia_fem : p.referencia_masc;
                        tr.innerHTML = `<td class="param-name">${p.nombre}</td><td><input type="text" class="result-input" value="${p.val || ''}" oninput="actualizarValor(${item.estIdx}, ${item.pIdx}, this.value)"></td><td style="width:15%;">${p.unidades}</td><td style="width:25%; font-size:10pt; font-style:italic; color:#666;">${refValue}</td>`;
                        currentTbody.appendChild(tr);
                        filasEnEstaPagina++;
                    }
                    filaActual++;
                }
                numPagina++;
            }
            actualizarFirma();
        }

        function actualizarValor(estIdx, pIdx, val) { estudiosAgregados[estIdx].parametros[pIdx].val = val; }

        function crearPaginaBase(container, numPagina) {
            const page = document.createElement("div");
            page.className = "document-page";
            let headerHtml = (numPagina === 1) ? `
                <div class="doc-header">
                    <img src="Assets/Logo.png" class="doc-logo" alt="Logo">
                    <div class="header-text">
                        <h1>Analitic</h1>
                        <p>LABORATORIO CLÍNICO PROFESIONAL</p>
                    </div>
                </div>
                <div class="patient-info">
                    <div class="info-line"><strong>Paciente</strong> <span>${datosPaciente.paciente_nombre || '—'}</span></div>
                    <div class="info-line"><strong>Fecha</strong> <span>${new Date().toLocaleDateString('es-MX')}</span></div>
                    <div class="info-line"><strong>Edad</strong> <span>${datosPaciente.paciente_edad || '—'} AÑOS</span></div>
                    <div class="info-line"><strong>Sexo</strong> <span>${(datosPaciente.paciente_sexo || '—').toUpperCase()}</span></div>
                    <div class="info-line" style="grid-column: span 2; margin-top:10px;">
                        <strong>Doctor(a)</strong> <input type="text" class="doctor-input" value="${datosPaciente.medico_solicitante || ''}">
                    </div>
                </div>
            ` : `
                <div class="page-header-mini">
                    <span>Reporte de Resultados</span>
                    <span>Paciente: ${datosPaciente.paciente_nombre}</span>
                </div>
            `;
            page.innerHTML = `<div class="watermark" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); font-size: 90px; color: rgba(0, 0, 0, 0.02); font-weight: 900; pointer-events: none; z-index: 0;">ANALITIC</div>${headerHtml}<div class="page-content"></div><div class="signature-container"></div>`;
            container.appendChild(page);
            return page;
        }

        function actualizarFirma() {
            document.querySelectorAll('.signature-container').forEach(c => c.innerHTML = '');
            const paginas = document.querySelectorAll('.signature-container');
            const ultimaFirma = paginas[paginas.length - 1];
            if (ultimaFirma) {
                ultimaFirma.innerHTML = `<div class="signature-block"><p>_______________________________________</p><p><strong>Q. C. Ma. Eugenia Velásquez Trejo</strong></p><p style="font-size: 10pt; color: #444; font-weight: 500;">Cédula Profesional 1536778 UV</p></div>`;
            }
        }

        function removerEstudio(index) { estudiosAgregados.splice(index, 1); reconstruirDocumento(); }
        async function guardarReporte() { alert("Reporte guardado con éxito."); volver(); }
        function volver() { window.location.href = "analisis.html"; }
    </script>
</body>

</html>
