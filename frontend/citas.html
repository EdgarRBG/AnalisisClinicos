<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Análisis - Analitic Laboratorio Clínico</title>

   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #4caf50;
            --accent: #a5d6a7;
            --selection: #2196f3;
            --occupied-blue: #e3f2fd;
            --occupied-text: #1976d2;
            --bg: #f5f9f0;
            --white: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f9f0, #e8f5e9);
            color: var(--text-main);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .container {
            padding: 40px 60px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .layout {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 40px;
            align-items: start;
        }

        .panel-registro {
            background: var(--white);
            border-radius: 30px;
            padding: 35px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 120px;
        }

        .panel-registro h3 {
            color: var(--primary-dark);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            font-size: 1rem;
            background: #f8fafc;
            transition: 0.3s;
            font-family: inherit;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 8px;
            border: 1px solid #e2e8f0;
        }

        .search-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .search-item:hover {
            background: #f0fdf4;
            color: var(--primary);
        }

        .switch-box {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px dashed #2196f3;
        }

        .switch-label {
            font-size: 0.9rem;
            font-weight: 800;
            color: #1976d2;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--selection);
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        .btn-save {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to right, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.2);
            transition: 0.3s;
        }

        .panel-calendario {
            background: var(--white);
            border-radius: 30px;
            padding: 35px;
            box-shadow: var(--shadow);
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .cal-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .btn-nav {
            background: #f1f5f9;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 14px;
            cursor: pointer;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 15px;
        }

        .weekdays div {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-muted);
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .day {
            aspect-ratio: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            font-size: 1.1rem;
            background: #f8fafc;
        }

        .day:hover {
            background: #f0fdf4;
        }

        .day.active {
            background: var(--selection);
            color: white;
        }

        .day.has-citas {
            background: #fff8e1;
            color: #f59e0b;
            border: 1px solid #fde68a;
        }

        .hours-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 14px;
            margin-top: 40px;
        }

        .hour-pill {
            padding: 16px;
            text-align: center;
            border-radius: 18px;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 700;
            border: 1px solid #f1f5f9;
        }

        .hour-pill.selected {
            background: var(--selection);
            color: white;
            border-color: var(--selection);
        }

        .hour-pill.occupied {
            background: var(--occupied-blue);
            color: var(--occupied-text);
            border-color: #bbdefb;
        }

        .selection-display {
            background: #f1f5f9;
            color: var(--text-main);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-weight: 800;
            margin-bottom: 25px;
            font-size: 1.2rem;
            border: 1px solid #e2e8f0;
        }

        .selection-display.active {
            background: var(--selection);
            color: white;
            border-color: var(--selection);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            padding: 40px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Solicitudes de Análisis</h1>
        <button class="btn-back" onclick="window.location.assign('dashboard.html')">
            <span class="material-symbols-outlined">dashboard</span> Dashboard
        </button>
    </div>

    <div class="container">
        <div class="layout">
            <div class="panel-registro">
                <h3><span class="material-symbols-outlined">add_circle</span> Nueva Solicitud</h3>

                <div class="form-group" id="containerBusqueda">
                    <label>PACIENTE</label>
                    <input type="text" id="buscarPaciente" placeholder="Buscar paciente..." autocomplete="off">
                    <input type="hidden" id="pacienteId">
                    <div id="searchResults" class="search-results"></div>
                </div>

                <div class="switch-box">
                    <span class="switch-label">EMERGENCIA / SOBRECUPO</span>
                    <label class="switch">
                        <input type="checkbox" id="switchSinRegistro" onchange="toggleSinRegistro()">
                        <span class="slider"></span>
                    </label>
                </div>

                <div id="camposNormales">
                    <div class="form-group">
                        <label>ESTUDIO SOLICITADO</label>
                        <input type="text" id="tipoEstudio" placeholder="Ej: Química Sanguínea">
                    </div>

                    <div class="form-group">
                        <label>OBSERVACIONES</label>
                        <textarea id="observaciones" placeholder="Notas adicionales..."></textarea>
                    </div>
                </div>

                <div id="displaySeleccion" class="selection-display">Selecciona fecha y hora</div>

                <button class="btn-save" id="btnGuardar" onclick="guardarSolicitud()">Registrar Solicitud</button>
            </div>

            <div class="panel-calendario">
                <div class="cal-header">
                    <button class="btn-nav" onclick="cambiarMes(-1)"><span
                            class="material-symbols-outlined">chevron_left</span></button>
                    <h2 id="mesAnio">Mayo 2026</h2>
                    <button class="btn-nav" onclick="cambiarMes(1)"><span
                            class="material-symbols-outlined">chevron_right</span></button>
                </div>

                <div class="weekdays">
                    <div>Dom</div>
                    <div>Lun</div>
                    <div>Mar</div>
                    <div>Mié</div>
                    <div>Jue</div>
                    <div>Vie</div>
                    <div>Sáb</div>
                </div>

                <div id="diasGrid" class="days"></div>
                <div id="horasGrid" class="hours-grid"></div>
            </div>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitulo" style="color:var(--primary-dark); margin-bottom:20px;">Detalles</h3>
            <div id="modalCuerpo" style="line-height:1.6; color:var(--text-main);"></div>
            <div style="margin-top:30px; display:flex; gap:10px;">
                <button class="btn-save" style="background:#f1f5f9; color:#64748b; box-shadow:none;"
                    onclick="cerrarModal()">Cerrar</button>
                <button class="btn-save" style="background:#fee2e2; color:#ef4444; box-shadow:none;"
                    onclick="cancelarCita()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let pacientes = [];
        let citas = [];
        let fechaSel = "";
        let horaSel = "";
        let mesAct = new Date().getMonth();
        let anioAct = new Date().getFullYear();
        let citaActId = null;

        const HORARIOS = [];
        for (let h = 8; h < 20; h++) {
            HORARIOS.push(`${h.toString().padStart(2, '0')}:00`);
            HORARIOS.push(`${h.toString().padStart(2, '0')}:30`);
        }

        window.addEventListener('pywebviewready', async () => {
            try {
                pacientes = await window.pywebview.api.obtenerTodosLosPacientes() || [];
                citas = await window.pywebview.api.obtenerCitas() || [];
                renderCalendario();
            } catch (e) { console.error(e); }
        });

        const inputBusca = document.getElementById("buscarPaciente");
        const resBusca = document.getElementById("searchResults");
        const idPac = document.getElementById("pacienteId");

        inputBusca.addEventListener("input", () => {
            const val = inputBusca.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            resBusca.innerHTML = "";
            if (val.length < 1 || document.getElementById("switchSinRegistro").checked) {
                resBusca.style.display = "none";
                return;
            }

            const matches = pacientes.filter(p => (p.nombre || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(val));
            if (matches.length > 0) {
                matches.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "search-item";
                    div.textContent = p.nombre;
                    div.onclick = () => {
                        inputBusca.value = p.nombre;
                        idPac.value = p.id;
                        resBusca.style.display = "none";
                    };
                    resBusca.appendChild(div);
                });
                resBusca.style.display = "block";
            } else { resBusca.style.display = "none"; }
        });

        function toggleSinRegistro() {
            const isChecked = document.getElementById("switchSinRegistro").checked;
            const campos = document.getElementById("camposNormales");
            const btn = document.getElementById("btnGuardar");
            const labelBusca = document.querySelector("#containerBusqueda label");

            if (isChecked) {
                campos.style.display = "none";
                labelBusca.textContent = "NOMBRE DEL PACIENTE (EMERGENCIA)";
                inputBusca.placeholder = "Escribe nombre rápido...";
                idPac.value = "EMERGENCIA";
                btn.textContent = "REGISTRAR EN ESPERA YA";
                btn.style.background = "linear-gradient(to right, #2196f3, #1976d2)";
            } else {
                campos.style.display = "block";
                labelBusca.textContent = "PACIENTE";
                inputBusca.placeholder = "Buscar paciente...";
                inputBusca.value = "";
                idPac.value = "";
                btn.textContent = "Registrar Solicitud";
                btn.style.background = "linear-gradient(to right, var(--primary), var(--primary-dark))";
            }
            if (fechaSel) renderHoras();
        }

        function renderCalendario() {
            const fecha = new Date(anioAct, mesAct, 1);
            document.getElementById("mesAnio").textContent = fecha.toLocaleDateString("es-MX", { month: "long", year: "numeric" }).toUpperCase();
            const startDay = fecha.getDay();
            const totalDays = new Date(anioAct, mesAct + 1, 0).getDate();
            const grid = document.getElementById("diasGrid");
            grid.innerHTML = "";
            for (let i = 0; i < startDay; i++) grid.appendChild(document.createElement("div"));
            for (let d = 1; d <= totalDays; d++) {
                const fStr = `${anioAct}-${(mesAct + 1).toString().padStart(2, '0')}-${d.toString().padStart(2, '0')}`;
                const div = document.createElement("div");
                div.className = "day";
                div.textContent = d;
                if (citas.some(c => c.fecha === fStr)) div.classList.add("has-citas");
                if (fechaSel === fStr) div.classList.add("active");
                div.onclick = () => { fechaSel = fStr; renderCalendario(); renderHoras(); actualizarDisplay(); };
                grid.appendChild(div);
            }
        }

        function renderHoras() {
            const grid = document.getElementById("horasGrid");
            grid.innerHTML = "";
            const sinRegistro = document.getElementById("switchSinRegistro").checked;
            HORARIOS.forEach(h => {
                const div = document.createElement("div");
                div.className = "hour-pill";
                div.textContent = h;
                const citaExistente = citas.find(c => c.fecha === fechaSel && c.hora === h);

                if (citaExistente) {
                    div.classList.add("occupied");
                    if (sinRegistro) {
                        div.onclick = () => seleccionarHora(h, div);
                    } else {
                        div.onclick = () => verDetalleCita(citaExistente);
                    }
                } else {
                    div.onclick = () => seleccionarHora(h, div);
                }

                if (horaSel === h) div.classList.add("selected");
                grid.appendChild(div);
            });
        }

        function seleccionarHora(h, el) {
            horaSel = h;
            document.querySelectorAll(".hour-pill").forEach(p => p.classList.remove("selected"));
            el.classList.add("selected");
            actualizarDisplay();
        }

        function actualizarDisplay() {
            const d = document.getElementById("displaySeleccion");
            if (fechaSel && horaSel) {
                d.textContent = `${fechaSel} - ${horaSel}`;
                d.classList.add("active");
            } else {
                d.textContent = "Selecciona fecha y hora";
                d.classList.remove("active");
            }
        }

        async function guardarSolicitud() {
            const isEmergencia = document.getElementById("switchSinRegistro").checked;
            const nombreManual = inputBusca.value;
            const estudio = document.getElementById("tipoEstudio").value;
            const obs = document.getElementById("observaciones").value;

            if (!fechaSel || !horaSel) return alert("Selecciona fecha y hora primero");

            if (isEmergencia) {
               
                const nom = nombreManual || "PACIENTE EMERGENCIA";
                const res = await window.pywebview.api.registrarEnEspera(
                    nom, '', null, '', fechaSel, horaSel, 'Emergencia (Por definir)', 'Registrado desde Citas (Modo Emergencia)'
                );
                if (res) { alert("¡Enviado a la lista de ESPERA!"); location.reload(); }
                else { alert("Error al enviar a espera"); }
            } else {
               
                const pacId = idPac.value;
                if (!pacId || !estudio) return alert("Faltan datos (Paciente o Estudio)");
                const res = await window.pywebview.api.registrarCita(pacId, fechaSel, horaSel, estudio, 'pendiente', obs);
                if (res) { alert("¡Cita registrada!"); location.reload(); }
                else { alert("Error al registrar cita"); }
            }
        }

        function verDetalleCita(c) {
            citaActId = c.id;
            document.getElementById("modalTitulo").textContent = c.nombre_paciente;
            document.getElementById("modalCuerpo").innerHTML = `<p><b>Estudio:</b> ${c.tipo}</p><p><b>Hora:</b> ${c.hora}</p><p><b>Notas:</b> ${c.observaciones || 'N/A'}</p>`;
            document.getElementById("infoModal").style.display = "flex";
        }

        async function cancelarCita() {
            if (confirm("¿Cancelar esta solicitud?")) {
                const res = await window.pywebview.api.eliminarCita(citaActId);
                if (res) location.reload();
            }
        }

        function cerrarModal() { document.getElementById("infoModal").style.display = "none"; }
        function cambiarMes(d) {
            mesAct += d;
            if (mesAct < 0) { mesAct = 11; anioAct--; }
            if (mesAct > 11) { mesAct = 0; anioAct++; }
            renderCalendario();
        }
    </script>
</body>

</html>
